<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160" height="20">
  <!-- Aurorae state names follow the bundled WhiteSur theme. -->
  <defs>
    <path id="glyph" d="m6 6 8 8m0-8-8 8" fill="none" stroke="#F87171" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <g id="active-center" transform="translate(0,0)">
    <rect width="20" height="20" rx="4" fill="#F87171" opacity="0"/>
    <use xlink:href="#glyph" opacity="1"/>
  </g>
  <g id="inactive-center" transform="translate(20,0)">
    <rect width="20" height="20" rx="4" fill="#F87171" opacity="0"/>
    <use xlink:href="#glyph" opacity="0.58"/>
  </g>
  <g id="hover-center" transform="translate(40,0)">
    <rect width="20" height="20" rx="4" fill="#F87171" opacity="0.16"/>
    <use xlink:href="#glyph" opacity="1"/>
  </g>
  <g id="hover-inactive-center" transform="translate(60,0)">
    <rect width="20" height="20" rx="4" fill="#F87171" opacity="0.16"/>
    <use xlink:href="#glyph" opacity="1"/>
  </g>
  <g id="pressed-center" transform="translate(80,0)">
    <rect width="20" height="20" rx="4" fill="#F87171" opacity="0.28"/>
    <use xlink:href="#glyph" opacity="1"/>
  </g>
  <g id="pressed-inactive-center" transform="translate(100,0)">
    <rect width="20" height="20" rx="4" fill="#F87171" opacity="0.28"/>
    <use xlink:href="#glyph" opacity="1"/>
  </g>
  <g id="deactivated-center" transform="translate(120,0)">
    <rect width="20" height="20" rx="4" fill="#F87171" opacity="0"/>
    <use xlink:href="#glyph" opacity="0.32"/>
  </g>
  <g id="deactivated-inactive-center" transform="translate(140,0)">
    <rect width="20" height="20" rx="4" fill="#F87171" opacity="0"/>
    <use xlink:href="#glyph" opacity="0.25"/>
  </g>
</svg>

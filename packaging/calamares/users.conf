---
defaultGroups:
  - sudo
  - audio
  - video
  - plugdev
  - netdev

autologinGroup: ""
sudoersGroup: ""
setRootPassword: false
doReusePassword: false
doAutologin: false
passwordRequirements:
  minLength: 8
  maxLength: 64
  libpwquality:
    - minlen=8
    - maxrepeat=3
    - maxsequence=3
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, ubuntu ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "ifba-os-${cpu}"
  forbidden_names: [ localhost ]

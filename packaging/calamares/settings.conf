---
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - removeuser
      - shellprocess
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - users
      - displaymanager
      - hwclock
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: ifba-os
prompt-install: true
